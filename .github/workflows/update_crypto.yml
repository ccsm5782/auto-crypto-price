name: Update Crypto Price

on:
  schedule:
    # 5분마다 실행 (GitHub Actions 특성상 정확히 5분마다 돌지 않고 지연될 수 있음)
    - cron: "*/5 * * * *"
  push:
    branches: [ "main" ]
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 권한 설정: 봇이 리포지토리에 글을 쓸(push) 권한을 부여
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run update_crypto.py
      run: |
        python update_crypto.py

    - name: Commit and Push
      run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경 사항이 있을 때만 커밋
          git add README.md
          git commit -m "자동 업데이트: 비트코인 시세 갱신" || echo "변경 사항이 없어 커밋하지 않습니다."
          git push